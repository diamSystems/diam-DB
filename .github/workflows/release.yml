name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: diam-db-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: diam-db-macos-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: diam-db-linux-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: diam-db-windows-x86_64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv target/${{ matrix.target }}/release/diam-db.exe ${{ matrix.artifact }}
          else
            mv target/${{ matrix.target }}/release/diam-db ${{ matrix.artifact }}
            chmod +x ${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: false

      - name: List artifacts
        run: |
          ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/diam-db-macos-x86_64/diam-db-macos-x86_64
            artifacts/diam-db-macos-arm64/diam-db-macos-arm64
            artifacts/diam-db-linux-x86_64/diam-db-linux-x86_64
            artifacts/diam-db-windows-x86_64.exe/diam-db-windows-x86_64.exe
            Dockerfile
          body: |
            ## Docker

            Build and run from Dockerfile:

            ```bash
            docker build -t diam-db .
            docker run -p 8080:8080 -v $(pwd)/data:/data diam-db
            ```

            ## Binary Downloads

            Download the appropriate binary for your platform.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
